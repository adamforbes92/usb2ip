; usb2ip — wireless USB/IP bridge for an aftermarket ECU
; ESP32-S3 (WROOM-1-N16, no PSRAM) acts as USB host on GPIO19/20 and serves the
; device over WiFi (soft-AP "usb2ip") via the USB/IP protocol on TCP:3240.
;
; Two environments build the same sources:
;   usb2ip-idf       (default) Arduino core compiled as an ESP-IDF component,
;                    so sdkconfig.defaults applies: 32 KB lwIP TCP buffers
;                    (fast-retransmit instead of 0.5-1 s timer stalls on a lost
;                    WiFi frame), larger WiFi/lwIP mailboxes, USB host tuning.
;                    First build downloads ESP-IDF + toolchain and takes a while.
;   usb2ip           precompiled Arduino libs, ~5.7 KB TCP buffers. Fallback.
;
;   pio run -e usb2ip               # fallback build
;   pio run -t uploadfs             # LittleFS image (data/) — either env

[platformio]
default_envs = usb2ip-idf
; Keep transient build/dependency files off the Google-Drive folder.
build_dir = ${sysenv.SYSTEMDRIVE}/.platformio/usb2ip-pio/build
libdeps_dir = ${sysenv.SYSTEMDRIVE}/.platformio/usb2ip-pio/libdeps
; Shares the normal PlatformIO core (C:/.platformio) again: every project is now on 55.03.312-1,
; so they all want the same toolchain and no longer swap it out from under each other.

[env]
; 55.03.312-1 (Arduino 3.3.12 / ESP-IDF 5.5.5): first pioarduino release on SCons 4.11.1,
; which PlatformIO Core 6.2.0 pins. Under 55.03.36 (SCons 4.8.1) the usb2ip-idf env fails
; at link with "No module named 'SCons.Tool.FortranCommon'".
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1

monitor_speed = 115200
; The console CH340's DTR/RTS drive the ESP's auto-reset circuit (EN/GPIO0).
; Left at the defaults, every monitor (re)connect hard-resets the board and
; holds GPIO0 low — seen as "crashes when I reconnect serial". Keep both lines
; deasserted; flashing still works (esptool drives them itself).
monitor_dtr = 0
monitor_rts = 0
; Bodge/flying-wire UART. 921600 is the esptool default; esptool MD5-verifies
; every flashed region, so a corrupted stream fails loudly rather than
; producing a bad image. Drop back to 115200 if uploads start failing.
upload_speed = 921600

; WROOM-1-N16: 16 MB flash, NO PSRAM (USB-host DMA requires internal SRAM).
; (the devkitc-1 board manifest says 8 MB; both the Arduino and the IDF
; builders need telling — the latter reads board_upload.*)
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
; Arduino's default_16MB layout, copied into the project so both envs find it.
board_build.partitions = partitions_16MB.csv
; Web gauge UI assets live in /data, served from a LittleFS image.
board_build.filesystem = littlefs

lib_deps =
  ESP32Async/AsyncTCP
  ESP32Async/ESPAsyncWebServer
  bblanchon/ArduinoJson@^7

build_flags =
  -D IGNITRON_USB
  -D CORE_DEBUG_LEVEL=0                 ; application logs are routed through Serial flags
  ; USB host uses the native OTG PHY on GPIO19/20 — keep Arduino off those pins.
  ; Console/logs go to UART0 (GPIO43 TX / 44 RX), not USB-Serial-JTAG.
  -D ARDUINO_USB_CDC_ON_BOOT=0
  ; Per-URB serial tracing for the USB/IP bridge. Leave OFF for real use: at
  ; 115200 baud it costs ~15 ms of blocking UART per URB, which alone breaks
  ; high-rate drivers (FTDI/CDC status polls). Set to 1 only when debugging.
  -D USBIP_TRACE_URBS=0

; --- Arduino as an ESP-IDF component: sdkconfig.defaults is honoured ---------
[env:usb2ip-idf]
framework = arduino, espidf
; IDF component manager off (see scripts/pio_pre_idf.py): the Arduino core's
; optional managed components are compiled out via CONFIG_ARDUINO_SELECTIVE_*
; and the one we need (joltwallet/littlefs) is vendored under components/.
extra_scripts = pre:scripts/pio_pre_idf.py

; --- Precompiled Arduino core (fallback) --------------------------------------
[env:usb2ip]
framework = arduino
; NOTE: CONFIG_USB_HOST_* / CONFIG_LWIP_* options live in the precompiled
; Arduino libs' sdkconfig (ctrl xfer max 256, periodic-OUT FIFO bias, 5.7 KB
; TCP buffers) and cannot be changed in this env.
